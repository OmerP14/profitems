<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..800;1,62..125,800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eceff1;
  --surface: #dde3e7;
  --ink: #000000;
  --accent-deep: #d8002a;
  --muted: #4a5058;
  --accent: #e8173f;
  --accent-ink: #ffffff;
  --body-tone: #c3c8cd;
  --on-dark-muted: #b4bac1;

  --step-small: clamp(0.8125rem, 0.79rem + 0.1vw, 0.875rem);
  --step-body: clamp(1.0625rem, 1rem + 0.25vw, 1.1875rem);
  --step-display: clamp(4.5rem, 9.4vw, 9.5rem);

  --margin: clamp(16px, 2.2vw, 32px);
  --ease-out: cubic-bezier(.2, .8, .2, 1);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Archivo", system-ui, sans-serif;
  font-size: var(--step-body);
  line-height: 1.5;
  font-variation-settings: "wdth" 100;
}
a { color: inherit; }
img, svg { display: block; max-width: 100%; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* First screen: dark stage with a looping training clip */
.stage { position: relative; isolation: isolate; background: var(--ink); color: #fff; overflow: hidden; }
.stage__video {
  position: absolute; inset: 0 0 auto 0; z-index: -2;
  width: 100%; height: 100svh; object-fit: cover;
  transform: scale(1.04); animation: drift 24s ease-in-out infinite alternate;
}
.stage::after {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: rgba(0, 0, 0, .6);
}
@keyframes drift { to { transform: scale(1.12) translateX(-1.5%); } }

/* Navigation */
.nav {
  position: relative; z-index: 3;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding: 20px var(--margin);
}
.nav__logo img { height: 44px; width: auto; }
.nav__links { display: flex; gap: 32px; list-style: none; margin: 0; padding: 0; }
.nav__links a { text-decoration: none; font-weight: 500; }
.nav__links a:hover { color: var(--accent); }
.nav__action { justify-self: end; }

.btn {
  display: inline-flex; align-items: center; gap: 10px;
  min-height: 48px; padding: 0 22px;
  background: var(--accent); color: var(--accent-ink);
  font: inherit; font-weight: 600; text-decoration: none;
  border: 0; border-radius: 0; cursor: pointer;
  transition: transform .18s var(--ease-out), background-color .18s;
}
.btn:hover { background: #c90f33; }
.btn:active { transform: scale(.97); }
.btn svg { width: 20px; height: 20px; }

/* Hero */
.hero {
  position: relative;
  min-height: calc(100svh - 84px);
  display: grid;
  grid-template-columns: 1fr minmax(0, 34vw) 1fr;
  grid-template-rows: auto 1fr;
  column-gap: var(--margin);
  padding: 0 var(--margin);
  overflow: hidden;
}
.hero__title {
  grid-column: 1 / -1; grid-row: 1;
  margin: 2vh 0 0;
  text-align: center;
  text-transform: uppercase;
  font-style: italic;
  font-weight: 800;
  font-variation-settings: "wdth" 62;
  font-size: var(--step-display);
  line-height: 1;
  letter-spacing: -0.02em;
  position: relative; z-index: 2;
}
.hero__title .line { display: block; overflow: hidden; padding: .02em .06em .02em; }
.hero__title .line > span { display: inline-block; }

.hero__figure {
  grid-column: 2; grid-row: 2;
  align-self: end;
  margin: 0;
  position: relative; z-index: 1;
}
.hero__figure svg { width: 100%; height: auto; max-height: calc(100svh - 84px - 2 * var(--step-display) - 6vh); margin: 0 auto; overflow: visible; }
/* the logo's slanted shading, enlarged behind the figure */
.fig-band { fill: var(--accent); }
.fig-band--deep { fill: var(--accent-deep); }
.js .fig-band { transform: translateX(-40px); opacity: 0; }
.is-in .fig-band, .bands-in .fig-band { transform: none; opacity: 1; transition: transform 1s var(--ease-out) .15s, opacity .6s .15s; }
.is-in .fig-band--deep, .bands-in .fig-band--deep { transition-delay: .3s; }

.hero__left, .hero__right {
  grid-row: 2; align-self: end;
  padding-bottom: 40px;
  position: relative; z-index: 2;
}
.hero__left { grid-column: 1; max-width: 360px; }
/* certificate: top-left on desktop, in the flow on phones */
.hero__cert { grid-column: 1; grid-row: 1; align-self: start; margin-top: 3vh; max-width: 300px; position: relative; z-index: 2; }
.hero__cert .cert { margin: 0; }

/* Goal picker (the live thing) */
.goals { border: 0; margin: 0; padding: 0; }
.goals legend { font-weight: 600; margin-bottom: 10px; padding: 0; }
.goals__list { display: flex; flex-wrap: wrap; gap: 8px; }
.goal {
  min-height: 44px; padding: 0 16px;
  font: inherit; font-size: var(--step-small); font-weight: 600;
  color: #fff; background: #1f2226;
  border: 0; border-radius: 0; cursor: pointer;
  transition: background-color .18s, color .18s, transform .18s var(--ease-out);
}
.goal:hover { background: #30343a; }
.goal:active { transform: scale(.96); }
.goal[aria-pressed="true"] { background: #fff; color: var(--ink); }
.goals__note { margin: 12px 0 0; min-height: 3em; font-size: var(--step-small); color: var(--on-dark-muted); }

.cert { display: grid; grid-template-columns: 76px 1fr; gap: 14px; align-items: center; margin: 0 0 20px; }
.cert img { width: 76px; height: auto; }
.cert p { margin: 0; font-weight: 600; line-height: 1.35; }
.facts { margin: 0; }
.facts div { display: flex; justify-content: space-between; gap: 16px; padding: 6px 0; }
.facts dt { color: var(--on-dark-muted); }
.facts dd { margin: 0; font-weight: 600; text-align: right; }

/* EMS figure */
.fig-body { fill: var(--body-tone); }
.fig-limb { stroke: var(--body-tone); stroke-linecap: round; stroke-linejoin: round; fill: none; }
.fig-suit { fill: var(--ink); }
.fig-strap { stroke: var(--ink); stroke-linecap: butt; fill: none; }
.fig-wire { stroke: var(--accent); stroke-width: 2; fill: none; stroke-dasharray: 5 7; opacity: .7; animation: current 1.2s linear infinite; }
.pad__body { fill: var(--accent); stroke: var(--ink); stroke-width: 2.5; transition: opacity .3s; }
.pad__snap { fill: #fff; transition: opacity .3s; }
.pad__body { transform-box: fill-box; transform-origin: center; }
.pad .ring { fill: none; stroke: #fff; stroke-width: 2; transform-box: fill-box; transform-origin: center; opacity: 0; }
.pad.on .ring { animation: pulse 1.6s var(--ease-out) infinite; animation-delay: var(--d, 0s); }
.pad.on .pad__body { animation: flicker 1.6s steps(2, end) infinite; animation-delay: var(--d, 0s); }
.figure--focus .pad:not(.on) .pad__body, .figure--focus .pad:not(.on) .pad__snap { opacity: .2; }
.fig-breath { transform-box: fill-box; transform-origin: 50% 100%; animation: breath 3.2s ease-in-out infinite; }

@keyframes pulse {
  0% { transform: scale(1); opacity: .9; }
  70% { transform: scale(1.7); opacity: 0; }
  100% { transform: scale(1.7); opacity: 0; }
}
@keyframes flicker { 0%, 100% { opacity: 1; } 50% { opacity: .75; } }
@keyframes current { to { stroke-dashoffset: -24; } }
@keyframes breath { 0%, 100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(4px) scaleY(.985); } }

/* Entrances */
.js .hero__title .line > span { transform: translateY(105%); }
.js .hero__figure { transform: translateY(60px); opacity: 0; }
.js .hero__left > *, .js .hero__right > *, .js .hero__cert > * { transform: translateY(20px); opacity: 0; }
.is-in .hero__title .line > span { transform: none; transition: transform .9s var(--ease-out); }
.is-in .hero__title .line:nth-child(2) > span { transition-delay: .09s; }
.is-in .hero__figure { transform: none; opacity: 1; transition: transform 1.1s var(--ease-out) .25s, opacity .8s .25s; }
.is-in .hero__left > *, .is-in .hero__right > *, .is-in .hero__cert > * { transform: none; opacity: 1; transition: transform .7s var(--ease-out), opacity .7s; }
.is-in .hero__left > :nth-child(1), .is-in .hero__right > :nth-child(1) { transition-delay: .45s; }
.is-in .hero__left > :nth-child(2), .is-in .hero__right > :nth-child(2) { transition-delay: .53s; }
.is-in .hero__left > :nth-child(3), .is-in .hero__right > :nth-child(3) { transition-delay: .61s; }

/* Chat */
.chat { position: fixed; right: var(--margin); bottom: var(--margin); z-index: 10; }
.chat__toggle {
  width: 60px; height: 60px; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--accent); color: #fff; display: grid; place-items: center;
  transition: transform .18s var(--ease-out), background-color .18s;
}
.chat__toggle:hover { transform: scale(1.06); background: #c90f33; }
.chat__toggle:active { transform: scale(.94); }
.chat__toggle svg { width: 26px; height: 26px; }
.chat__panel {
  position: absolute; right: 0; bottom: 76px; width: min(340px, calc(100vw - 32px));
  background: #fff; padding: 20px;
  box-shadow: 0 18px 50px rgba(14, 15, 18, .18); /* floating dialog */
  transform-origin: bottom right;
  transition: transform .22s var(--ease-out), opacity .22s;
}
.chat__panel[hidden] { display: block; transform: scale(.92) translateY(8px); opacity: 0; pointer-events: none; visibility: hidden; }
.chat__panel h2 { margin: 0 0 4px; font-size: 1.125rem; }
.chat__panel > p { margin: 0 0 14px; color: var(--muted); font-size: var(--step-small); }
.chat__log { display: grid; gap: 8px; margin-bottom: 14px; max-height: 220px; overflow-y: auto; }
.chat__msg { margin: 0; padding: 10px 12px; background: var(--bg); font-size: .9375rem; }
.chat__msg--me { justify-self: end; background: var(--ink); color: #fff; }
.chat__quick { display: flex; flex-wrap: wrap; gap: 6px; }
.chat__quick button {
  min-height: 40px; padding: 0 12px; border: 0; cursor: pointer;
  font: inherit; font-size: .875rem; font-weight: 600; background: var(--surface); color: var(--ink);
}
.chat__quick button:hover { background: #cdd5da; }

/* Phone */
@media (max-width: 860px) {
  .nav { grid-template-columns: 1fr auto; padding: 14px var(--margin); }
  .nav > nav { display: none; }
  .nav__logo img { height: 36px; }
  .btn { min-height: 44px; padding: 0 14px; gap: 8px; font-size: .9375rem; }
  .hero { grid-template-columns: 1fr; grid-template-rows: auto auto auto auto auto; min-height: 0; }
  .hero__title { font-size: 21vw; margin-top: 4vh; text-align: left; }
  .hero__figure { grid-column: 1; grid-row: 2; width: 72%; justify-self: center; margin-top: 8px; }
  .hero__figure svg { max-height: none; }
  .hero__left { grid-column: 1; grid-row: 3; max-width: none; padding: 32px 0 0; }
  .hero__cert { grid-column: 1; grid-row: 4; max-width: none; margin: 32px 0 0; padding-bottom: 104px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .js .hero__title .line > span, .js .hero__figure, .js .fig-band, .js .hero__left > *, .js .hero__right > *, .js .hero__cert > * { transform: none; opacity: 1; }
  .pad.on .ring { opacity: 0; }
}
</style>
</head>

      <p class="chat__msg">Merhaba! Ne öğrenmek istersin?</p>
    </div>
    <div class="chat__quick">
      <button type="button" data-q="yer">Neredesiniz?</button>
      <button type="button" data-q="saat">Saatleriniz?</button>
      <button type="button" data-q="belge">Belgeniz var mı?</button>
      <button type="button" data-q="randevu">Randevu almak istiyorum</button>
    </div>
  </div>
  <button class="chat__toggle" type="button" aria-expanded="false" aria-controls="chat-panel" aria-label="Asistanı aç">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 4h16v12H8l-4 4V4Zm2 2v9.2L7.2 14H18V6H6Zm2 3h8v2H8V9Z"/></svg>
  </button>
</div>

<script>
// background clip: phones get the light portrait cut; skipped for reduced motion / data saver
(() => {
  const v = document.querySelector('.stage__video');
  const narrow = matchMedia('(max-width: 860px)').matches;
  v.poster = narrow ? v.dataset.posterNarrow : v.dataset.posterWide;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const saver = navigator.connection && navigator.connection.saveData;
  if (reduce || saver) return;
  v.src = narrow ? v.dataset.srcNarrow : v.dataset.srcWide;
  v.play().catch(() => {});
})();

// entrance runs through Motion (module below); CSS fallback if it fails to load
setTimeout(() => { if (!window.__motion) document.body.classList.add('is-in'); }, 1200);

// goal picker
const fig = document.getElementById('ems-figure');
const pads = fig.querySelectorAll('.pad');
const note = document.getElementById('goal-note');
const notes = {
  zayiflama: 'Zayıflama: karın ve bacak bölgeleri birlikte çalışır.',
  sikilasma: 'Sıkılaşma: göğüs, kol ve bacak kasları çalışır.',
  incelme: 'İncelme: karın ve bel çevresi öne çıkar.',
  agri: 'Bel ve boyun: omuz ve bel bölgesi desteklenir.'
};
document.querySelectorAll('.goal').forEach(btn => {
  btn.addEventListener('click', () => {
    const goal = btn.dataset.goal;
    const was = btn.getAttribute('aria-pressed') === 'true';
    document.querySelectorAll('.goal').forEach(b => b.setAttribute('aria-pressed', 'false'));
    if (was) {
      fig.classList.remove('figure--focus');
      pads.forEach(p => p.classList.add('on'));
      note.textContent = 'Birini seç, figürde çalışan bölgeleri gör.';
      return;
    }
    btn.setAttribute('aria-pressed', 'true');
    fig.classList.add('figure--focus');
    pads.forEach(p => p.classList.toggle('on', p.dataset.zones.split(' ').includes(goal)));
    note.textContent = notes[goal];
    document.dispatchEvent(new Event('goal:change'));
  });
});

// chat
const toggle = document.querySelector('.chat__toggle');
const panel = document.getElementById('chat-panel');
const log = document.getElementById('chat-log');
const wa = 'https://wa.me/905366613993?text=' + encodeURIComponent('Merhaba, randevu almak istiyorum.');
const answers = {
  yer: 'Kılınçarslan Mah., Urfa Sk. No:9C, Selçuklu/Konya. Avrukon Plaza, Şefikcan Kafe giriş kapısının karşısı.',
  saat: 'Her gün 10:00 ile 22:00 arası açığız.',
  belge: 'Evet, tesisimiz Türkiye Cimnastik Federasyonu yeterlilik belgesine sahip.',
  randevu: `Randevu için WhatsApp'tan yazabilir ya da 0536 661 39 93'ü arayabilirsin. <a href="${wa}" target="_blank" rel="noopener">WhatsApp'ı aç</a>`
};
toggle.addEventListener('click', () => {
  const open = panel.hidden;
  panel.hidden = !open;
  toggle.setAttribute('aria-expanded', String(open));
  toggle.setAttribute('aria-label', open ? 'Asistanı kapat' : 'Asistanı aç');
});
document.querySelectorAll('.chat__quick button').forEach(b => {
  b.addEventListener('click', () => {
    const me = document.createElement('p');
    me.className = 'chat__msg chat__msg--me';
    me.textContent = b.textContent;
    const bot = document.createElement('p');
    bot.className = 'chat__msg';
    bot.innerHTML = answers[b.dataset.q];
    log.append(me, bot);
    log.scrollTop = log.scrollHeight;
  });
});
</script>
<script type="module">
import { animate, stagger, press } from "https://cdn.jsdelivr.net/npm/motion@12.23.12/+esm";

window.__motion = true;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ease = [0.22, 1, 0.36, 1];
const spring = { type: 'spring', stiffness: 140, damping: 20, mass: 1 };
const tap = { type: 'spring', stiffness: 400, damping: 20 };

// one orchestrated entrance: headline, the logo bands, the figure, then the side columns
if (reduce || document.body.classList.contains('is-in')) {
  document.body.classList.add('is-in');
} else {
  animate('.hero__title .line > span', { y: ['105%', '0%'] }, { ...spring, delay: stagger(0.09) });
  // SVG bands: Motion would write attributes that the CSS hidden state overrides, so let CSS run them
  document.getElementById('ems-figure').classList.add('bands-in');
  animate('.hero__figure', { y: [60, 0], opacity: [0, 1] }, { ...spring, delay: 0.25 });
  animate('.hero__cert > *, .hero__left > *, .hero__right > *', { y: [20, 0], opacity: [0, 1] }, { duration: 0.7, ease, delay: stagger(0.07, { startDelay: 0.45 }) });
}

// press feedback on every control
press('.goal, .btn, .chat__toggle, .chat__quick button', el => {
  animate(el, { scale: 0.95 }, tap);
  return () => animate(el, { scale: 1 }, tap);
});

// choosing a goal sends an impulse through the figure
document.addEventListener('goal:change', () => {
  if (reduce) return;
  animate('#ems-figure', { x: [0, -3, 3, -2, 1, 0] }, { duration: 0.35 });
  animate('#ems-figure .pad.on .pad__body', { scale: [1, 1.22, 1] }, { duration: 0.45, ease, delay: stagger(0.03) });
});
</script>
</body>
</html>
